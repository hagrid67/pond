# Include this file from an nginx server block on jwpc12 that is reachable from gcweb1.
# Replace 203.0.113.10 with the gcweb1 public IP, or widen to the correct CIDR.

location = /internal-api/ingest {
    allow 203.0.113.10;
    deny all;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 10s;
    client_max_body_size 256k;
    proxy_pass http://127.0.0.1:9100/internal-api/ingest;
    limit_except POST { deny all; }
}

location = /internal-api/healthz {
    allow 203.0.113.10;
    deny all;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 5s;
    proxy_pass http://127.0.0.1:9100/internal-api/healthz;
    limit_except GET HEAD { deny all; }
}