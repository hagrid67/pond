# Include this file from the nginx server block that serves the pond site on gcweb1.

location = /api/pondupdate {
    limit_req zone=pond_submit_per_ip burst=10 nodelay;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 10s;
    client_max_body_size 256k;
    proxy_pass http://127.0.0.1:9000/api/pondupdate;
    limit_except POST OPTIONS { deny all; }
}

location = /api/health {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 5s;
    proxy_pass http://127.0.0.1:9000/api/health;
    limit_except GET HEAD { deny all; }
}
